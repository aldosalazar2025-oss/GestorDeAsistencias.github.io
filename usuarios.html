<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | Asistencia Escolar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/estilos.css">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/logo-180.png">
  <meta name="theme-color" content="#080d1a">
</head>

<!-- data-rol-requerido="admin": auth-guard.js redirige a index.html
     si el usuario que inició sesión no es administrador -->
<body data-rol-requerido="admin" class="p-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="titulo-pagina"><img src="assets/logo.png" alt="Lalito Quien Mas" class="logo-cabecera"><span><i class="fa-solid fa-users-gear"></i> Gestión de usuarios</span></h2>
    <div>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Volver al panel
      </a>
      <button id="btnLogout" class="btn btn-outline-danger btn-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Salir
      </button>
    </div>
  </div>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card p-3">
        <h5 class="mb-3">Nuevo usuario</h5>

        <form id="formUsuario">
          <div class="mb-2">
            <label class="form-label">Nombre completo</label>
            <input type="text" id="nombre" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Contraseña temporal</label>
            <input type="password" id="password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Rol</label>
            <select id="rol" class="form-select" required>
              <option value="encargado">Personal de asistencia</option>
              <option value="admin">Administrador</option>
            </select>
          </div>

          <div id="mensajeUsuario" class="alert d-none"></div>

          <button type="submit" class="btn btn-primary w-100">
            <i class="fa-solid fa-user-plus"></i> Crear usuario
          </button>
        </form>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card p-3">
        <h5 class="mb-3">Usuarios registrados</h5>
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios">
            <tr><td colspan="4" class="text-center">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/usuarios.js"></script>
</body>
</html>
