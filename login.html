<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Asistencia Escolar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/estilos.css">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/logo-180.png">
  <meta name="theme-color" content="#080d1a">

  <style>
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    .login-container{
      background:linear-gradient(180deg, rgba(16,26,48,.9), rgba(12,20,36,.9));
      border:1px solid var(--panel-border-strong, rgba(120,160,255,.28));
      padding:40px;
      border-radius:18px;
      box-shadow:0 20px 50px rgba(0,0,0,.5), 0 0 24px rgba(32,227,210,.12);
      width:100%;
      max-width:400px;
    }
    .login-container .logo{
      text-align:center;
      margin-bottom:30px;
      color:var(--cian-fuerte, #5df2e4);
    }
    .login-container .logo-login{
      width:140px;
      height:140px;
      object-fit:contain;
      margin-bottom:6px;
      filter:drop-shadow(0 0 22px rgba(32,227,210,.45));
    }
    .login-container .logo h3{
      font-family:'Space Grotesk', sans-serif;
      font-weight:700;
      margin-top:10px;
    }
    .login-container label{
      color:var(--texto-mid, #aab3cc);
      font-weight:600;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }
    .login-container .form-control{
      background:rgba(255,255,255,.03);
      border:1px solid var(--panel-border, rgba(120,160,255,.14));
      color:var(--texto, #e9edf7);
      border-radius:10px;
      padding:12px 14px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <img src="assets/logo.png" alt="Lalito Quien Mas" class="logo-login">
      <h3>Asistencia Escolar</h3>
    </div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="correo" class="form-control" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" required autocomplete="current-password">
      </div>

      <div id="mensajeError" class="alert alert-danger d-none"></div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="fa-solid fa-right-to-bracket"></i> Ingresar
      </button>
    </form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
