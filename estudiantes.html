<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudiantes | Asistencia Escolar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/estilos.css">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/logo-180.png">
  <meta name="theme-color" content="#080d1a">

  <style>
    .foto-estudiante {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<!-- Solo admin: la creación/edición/desactivación de estudiantes
     está reservada a administradores (ver firestore.rules) -->
<body data-rol-requerido="admin" class="p-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="titulo-pagina"><img src="assets/logo.png" alt="Lalito Quien Mas" class="logo-cabecera"><span><i class="fa-solid fa-user-graduate"></i> Gestión de estudiantes</span></h2>
    <div>
      <button id="btnDescargarPlantilla" class="btn btn-outline-secondary btn-sm">
        <i class="fa-solid fa-file-arrow-down"></i> Plantilla
      </button>
      <button id="btnImportarExcel" class="btn btn-outline-primary btn-sm">
        <i class="fa-solid fa-file-import"></i> Importar Excel
      </button>
      <input type="file" id="inputImportarExcel" accept=".xlsx,.xls" class="d-none">
      <button id="btnExportarExcel" class="btn btn-outline-success btn-sm">
        <i class="fa-solid fa-file-export"></i> Exportar
      </button>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Volver al panel
      </a>
      <button id="btnLogout" class="btn btn-outline-danger btn-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Salir
      </button>
    </div>
  </div>

  <div class="row g-4">

    <div class="col-lg-4">
      <div class="card p-3">
        <h5 class="mb-3">Nuevo estudiante</h5>

        <form id="formEstudiante">
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Nombres</label>
              <input type="text" id="nombres" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label">Apellidos</label>
              <input type="text" id="apellidos" class="form-control" required>
            </div>
          </div>

          <div class="mt-2">
            <label class="form-label">DNI</label>
            <input type="text" id="dni" class="form-control" maxlength="8" required>
          </div>

          <div class="row g-2 mt-1">
            <div class="col-4">
              <label class="form-label">Grado</label>
              <input type="text" id="grado" class="form-control" placeholder="5º" required>
            </div>
            <div class="col-4">
              <label class="form-label">Sección</label>
              <input type="text" id="seccion" class="form-control" placeholder="A" required>
            </div>
            <div class="col-4">
              <label class="form-label">Turno</label>
              <select id="turno" class="form-select" required>
                <option value="manana">Mañana</option>
                <option value="tarde">Tarde</option>
              </select>
            </div>
          </div>

          <div class="mt-2">
            <label class="form-label">Fotografía (opcional)</label>
            <input type="file" id="foto" accept="image/*" class="form-control">
          </div>

          <div id="mensajeEstudiante" class="alert d-none mt-3"></div>

          <button type="submit" class="btn btn-primary w-100 mt-3">
            <i class="fa-solid fa-qrcode"></i> Registrar y generar QR
          </button>
        </form>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card p-3">

        <div class="row g-2 mb-2">
          <div class="col-md-4">
            <input type="text" id="buscar" class="form-control" placeholder="Buscar por nombre o DNI…">
          </div>
          <div class="col-md-3">
            <select id="filtroGrado" class="form-select"><option value="">Todos</option></select>
          </div>
          <div class="col-md-2">
            <select id="filtroSeccion" class="form-select"><option value="">Todas</option></select>
          </div>
          <div class="col-md-3">
            <select id="filtroTurno" class="form-select">
              <option value="">Todos los turnos</option>
              <option value="manana">Mañana</option>
              <option value="tarde">Tarde</option>
            </select>
          </div>
        </div>

        <!-- FASE 5: descarga masiva de los QR que coincidan con el filtro actual
             (solo estudiantes activos; ver docs/fase5-qr.md) -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <small id="contadorLoteQR" class="text-muted">Calculando…</small>
          <div>
            <button id="btnDescargarQrZip" type="button" class="btn btn-outline-secondary btn-sm">
              <i class="fa-solid fa-file-zipper"></i> QR del filtro (ZIP)
            </button>
            <button id="btnDescargarQrPdf" type="button" class="btn btn-outline-secondary btn-sm">
              <i class="fa-solid fa-file-pdf"></i> QR del filtro (PDF)
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Estudiante</th>
                <th>Grado</th>
                <th>Turno</th>
                <th>Código QR</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaEstudiantes">
              <tr><td colspan="7" class="text-center">Cargando…</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <!-- Modal editar -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formEditar">
          <div class="modal-header">
            <h5 class="modal-title">Editar estudiante</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editarId">
            <div class="mb-2">
              <label class="form-label">Nombres</label>
              <input type="text" id="editarNombres" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Apellidos</label>
              <input type="text" id="editarApellidos" class="form-control" required>
            </div>
            <div class="row g-2">
              <div class="col-4">
                <label class="form-label">Grado</label>
                <input type="text" id="editarGrado" class="form-control" required>
              </div>
              <div class="col-4">
                <label class="form-label">Sección</label>
                <input type="text" id="editarSeccion" class="form-control" required>
              </div>
              <div class="col-4">
                <label class="form-label">Turno</label>
                <select id="editarTurno" class="form-select" required>
                  <option value="manana">Mañana</option>
                  <option value="tarde">Tarde</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal vista previa de importación -->
  <div class="modal fade" id="modalPreviewImport" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Vista previa de importación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="resumenPreviewImport" class="mb-3"></div>
          <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Fila</th>
                  <th>Nombre</th>
                  <th>DNI</th>
                  <th>Grado/Sección</th>
                  <th>Turno</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="tablaPreviewImport"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btnConfirmarImport" class="btn btn-primary">Confirmar importación</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/estudiantes.js"></script>
  <script type="module" src="js/estudiantes-excel.js"></script>
  <script type="module" src="js/estudiantes-qr-lote.js"></script>
</body>
</html>
