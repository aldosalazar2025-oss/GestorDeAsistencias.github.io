<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Asistencia Escolar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/estilos.css">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/logo-180.png">
  <meta name="theme-color" content="#080d1a">
</head>
<!-- Sin data-rol-requerido: el personal de asistencia también necesita
     consultar informes (ver firestore.rules: lectura de asistencias). -->
<body class="p-4">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="titulo-pagina"><img src="assets/logo.png" alt="Lalito Quien Mas" class="logo-cabecera"><span><i class="fa-solid fa-file-lines"></i> Reportes</span></h2>
    <div class="d-flex flex-wrap gap-2">
      <a href="index.html" class="btn btn-outline-secondary btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Volver al panel
      </a>
      <button id="btnLogout" class="btn btn-outline-danger btn-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Salir
      </button>
    </div>
  </div>

  <ul class="nav nav-tabs mb-4" id="pestanas">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#panelIndividual" type="button">
        <i class="fa-solid fa-user"></i> Informe individual
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#panelGeneral" type="button">
        <i class="fa-solid fa-users"></i> Reporte general
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ==================== INFORME INDIVIDUAL ==================== -->
    <div class="tab-pane fade show active" id="panelIndividual">

      <div class="tabla mb-4">
        <h3><i class="fa-solid fa-magnifying-glass"></i> Elegir estudiante y periodo</h3>

        <div class="row g-3 align-items-end">

          <div class="col-md-5">
            <label class="form-label">Estudiante</label>
            <input type="text" id="buscarIndividual" class="form-control"
                   placeholder="Nombre o DNI" autocomplete="off">
            <div id="resultadosIndividual" class="lista-resultados mt-2"></div>
          </div>

          <div class="col-md-3">
            <label class="form-label">Desde</label>
            <input type="date" id="desdeIndividual" class="form-control">
          </div>

          <div class="col-md-3">
            <label class="form-label">Hasta</label>
            <input type="date" id="hastaIndividual" class="form-control">
          </div>

          <div class="col-md-1">
            <button id="btnGenerarIndividual" class="btn btn-primary w-100" disabled>
              <i class="fa-solid fa-play"></i>
            </button>
          </div>

        </div>

        <div id="estudianteElegido" class="mt-3 text-muted">
          Ningún estudiante seleccionado.
        </div>
      </div>

      <div id="resultadoIndividual"></div>

    </div>

    <!-- ==================== REPORTE GENERAL ==================== -->
    <div class="tab-pane fade" id="panelGeneral">

      <div class="tabla mb-4">
        <h3><i class="fa-solid fa-sliders"></i> Periodo y alcance</h3>

        <div class="row g-3 align-items-end">

          <div class="col-md-3">
            <label class="form-label">Periodo</label>
            <select id="tipoPeriodo" class="form-select">
              <option value="dia">Día</option>
              <option value="semana">Semana</option>
              <option value="mes">Mes</option>
              <option value="rango">Rango personalizado</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Desde</label>
            <input type="date" id="desdeGeneral" class="form-control">
          </div>

          <div class="col-md-3">
            <label class="form-label">Hasta</label>
            <input type="date" id="hastaGeneral" class="form-control">
          </div>

          <div class="col-md-3">
            <label class="form-label">Turno</label>
            <select id="turnoGeneral" class="form-select">
              <option value="">Todos</option>
              <option value="manana">Mañana</option>
              <option value="tarde">Tarde</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Grado</label>
            <select id="gradoGeneral" class="form-select">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Sección</label>
            <select id="seccionGeneral" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Estudiante (opcional)</label>
            <input type="text" id="estudianteGeneral" class="form-control"
                   placeholder="Nombre o DNI" autocomplete="off">
          </div>

          <div class="col-md-3">
            <button id="btnGenerarGeneral" class="btn btn-primary w-100">
              <i class="fa-solid fa-play"></i> Generar
            </button>
          </div>

        </div>
      </div>

      <div id="resultadoGeneral"></div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script type="module" src="js/auth-guard.js"></script>
  <script src="js/tablas-responsivas.js"></script>
  <script type="module" src="js/reportes.js"></script>
  <script type="module" src="js/reportes-excel.js"></script>
</body>
</html>
